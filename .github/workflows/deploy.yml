name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Requires vars.SSH_HOST / vars.SSH_USER and secrets.DEPLOY_SSH_KEY, provisioned
# by scripts/provision-acm-hotels-deploy.sh (issue #3) — see docs/infrastructure.md.
# Until those are set, build-and-push succeeds but deploy/verify will fail.
# The server also pulls without a registry login, so the GHCR package needs to
# be set public after its first push — see docs/infrastructure.md.
# Also requires vars.SANITY_PROJECT_ID / vars.SANITY_DATASET (non-secret) and
# secrets.SANITY_REVALIDATE_SECRET (issue #6) — the latter must match the
# secret configured on the Sanity webhook that POSTs to /api/revalidate.
# secrets.SANITY_API_TOKEN is a read-only (Viewer) token: the dataset's
# anonymous-read grant can't see documents whose _id contains a "." (e.g.
# "cooperationModel.management"), so the server-side Sanity client needs an
# authenticated read to see those — see docs/infrastructure.md. Needed at
# BOTH build time (passed as a BuildKit secret below — app/[lang] prerenders
# at build time via generateStaticParams) and runtime (docker-compose.yml);
# without it at build time, the image bakes in the "under construction"
# fallback until the next content webhook or hourly revalidate fires.
# secrets.SANITY_LEADS_WRITE_TOKEN is a separate, narrower-scoped token
# (Editor role, Create permission only) that POST /api/leads uses to write
# lead-form submissions as `lead` documents. Deliberately not the same token
# as SANITY_API_TOKEN, so a leaked read token can never be used to write
# data. Without it, the lead form fails closed with a 500, not silently.
env:
  # vars.DOMAIN is set by scripts/provision-acm-hotels-deploy.sh (stage 5);
  # the literal fallback only covers a run before that's ever been done.
  ACM_DOMAIN: ${{ vars.DOMAIN || 'partners.acm-hotels.ru' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./site
          push: true
          tags: ${{ steps.image.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ vars.SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ vars.SANITY_DATASET }}
          secrets: |
            sanity_api_token=${{ secrets.SANITY_API_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: site/docker-compose.yml
          target: /opt/acm-hotels
          strip_components: 1
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SANITY_REVALIDATE_SECRET,SANITY_API_TOKEN,SANITY_LEADS_WRITE_TOKEN
          script: |
            cd /opt/acm-hotels
            echo "SANITY_REVALIDATE_SECRET=${SANITY_REVALIDATE_SECRET}" > .env
            echo "SANITY_API_TOKEN=${SANITY_API_TOKEN}" >> .env
            echo "SANITY_LEADS_WRITE_TOKEN=${SANITY_LEADS_WRITE_TOKEN}" >> .env
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
        env:
          SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_LEADS_WRITE_TOKEN: ${{ secrets.SANITY_LEADS_WRITE_TOKEN }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Post-deploy smoke check (ADR-0002): an HTTP-level check against the
      # live public domain, asserting a successful response with expected
      # marker content — not container/network internals.
      - name: Check the live domain responds
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${ACM_DOMAIN}/" | grep -q 'data-health-check="ok"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after retries"
          exit 1
