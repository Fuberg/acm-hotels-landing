services:
  web:
    image: ghcr.io/fuberg/acm-hotels-landing:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Read from a .env file the deploy workflow writes alongside this file
      # on the server — never committed here. See .github/workflows/deploy.yml.
      SANITY_REVALIDATE_SECRET: ${SANITY_REVALIDATE_SECRET}
    expose:
      - "3000"
    networks:
      edge:
        aliases:
          - acm-hotels

networks:
  edge:
    external: true
    name: edge
